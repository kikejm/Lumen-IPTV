name: Release

# Se lanza al hacer push de un tag vX.Y.Z. Compila el APK firmado y publica una
# GitHub Release con el APK y `update.json` (lo que lee el actualizador de la app).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore y .env
        env:
          LUMEN_KEYSTORE_BASE64: ${{ secrets.LUMEN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LUMEN_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret LUMEN_KEYSTORE_BASE64 (las actualizaciones necesitan siempre la misma firma)"
            exit 1
          fi
          mkdir -p keystore
          echo "$LUMEN_KEYSTORE_BASE64" | base64 --decode > keystore/lumen-release.jks
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$(grep '^lumen.versionCode=' gradle.properties | cut -d= -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          {
            echo "LUMEN_KEYSTORE_PATH=keystore/lumen-release.jks"
            echo "LUMEN_VERSION_NAME=$VERSION_NAME"
            echo "LUMEN_UPDATE_GITHUB_REPO=${{ github.repository }}"
          } > .env

      - name: Tests y build release
        env:
          LUMEN_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_KEYSTORE_PASSWORD }}
          LUMEN_KEY_ALIAS: ${{ secrets.LUMEN_KEY_ALIAS }}
          LUMEN_KEY_PASSWORD: ${{ secrets.LUMEN_KEY_PASSWORD }}
          LUMEN_UPDATE_GITHUB_TOKEN: ${{ secrets.LUMEN_UPDATE_GITHUB_TOKEN }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Empaquetar artefactos
        run: |
          mkdir -p release
          APK="release/lumen-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES=$(git log -1 --pretty=%B | head -c 2000)
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg sha256 "$SHA" \
            --arg notes "$NOTES" \
            --arg apkUrl "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/lumen-${VERSION_NAME}.apk" \
            '{versionCode: $versionCode, versionName: $versionName, sha256: $sha256, notes: $notes, apkUrl: $apkUrl}' \
            > release/update.json
          cat release/update.json

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Lumen ${VERSION_NAME}" \
            --generate-notes
