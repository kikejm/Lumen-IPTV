name: Build

# Compila los dos sabores (tv y mobile) y pasa los tests en cada push y PR.
# No firma ni publica nada: eso lo hace release.yml con los tags vX.Y.Z.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests y build debug (tv y mobile)
        run: ./gradlew --no-daemon testTvDebugUnitTest testMobileDebugUnitTest assembleTvDebug assembleMobileDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 7
